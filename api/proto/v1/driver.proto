syntax = "proto3";

package wuji.v1;

option go_package = "github.com/coditary/wuji/api/proto/v1;wujiv1";

service DriverRegistry {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);
}

service DriverService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc GenerateText(GenerateTextRequest) returns (GenerateTextResponse);
  rpc GenerateImage(GenerateImageRequest) returns (GenerateImageResponse);
  rpc GenerateVideo(GenerateVideoRequest) returns (GenerateVideoResponse);
  rpc GenerateAudio(GenerateAudioRequest) returns (GenerateAudioResponse);
  rpc Generate3D(Generate3DRequest) returns (Generate3DResponse);
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);
  rpc CloneVoice(CloneVoiceRequest) returns (CloneVoiceResponse);
  rpc Train(TrainRequest) returns (TrainResponse);
  rpc ManageDataset(ManageDatasetRequest) returns (ManageDatasetResponse);
}

message DriverMetadata {
  string id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  repeated string capabilities = 5;
}

message RegisterRequest {
  DriverMetadata metadata = 1;
  string endpoint = 2;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message HeartbeatRequest {
  string driver_id = 1;
}

message HeartbeatResponse {
  bool alive = 1;
}

message UnregisterRequest {
  string driver_id = 1;
}

message UnregisterResponse {
  bool success = 1;
}

message GetInfoRequest {}

message GetInfoResponse {
  DriverMetadata metadata = 1;
}

message GenerateTextRequest {
  string prompt = 1;
  int32 max_tokens = 2;
  float temperature = 3;
}

message GenerateTextResponse {
  string text = 1;
  int32 tokens_used = 2;
  string finish_reason = 3;
}

message GenerateImageRequest {
  string prompt = 1;
  int32 width = 2;
  int32 height = 3;
  int32 steps = 4;
}

message GenerateImageResponse {
  string path = 1;
  string format = 2;
}

message GenerateVideoRequest {
  string prompt = 1;
  float duration = 2;
  int32 fps = 3;
}

message GenerateVideoResponse {
  string path = 1;
  float duration = 2;
}

message GenerateAudioRequest {
  string prompt = 1;
  float duration = 2;
}

message GenerateAudioResponse {
  string path = 1;
  float duration = 2;
}

message Generate3DRequest {
  string prompt = 1;
  string format = 2;
}

message Generate3DResponse {
  string path = 1;
  string format = 2;
}

message SynthesizeRequest {
  string text = 1;
  string voice = 2;
}

message SynthesizeResponse {
  string path = 1;
  float duration = 2;
}

message TranscribeRequest {
  string audio_path = 1;
  string language = 2;
}

message TranscribeResponse {
  string text = 1;
  float confidence = 2;
}

message CloneVoiceRequest {
  string sample_path = 1;
  string name = 2;
}

message CloneVoiceResponse {
  string voice_id = 1;
  string name = 2;
}

message TrainRequest {
  string dataset_id = 1;
  string model_type = 2;
  int32 epochs = 3;
}

message TrainResponse {
  string job_id = 1;
  string status = 2;
}

message DatasetEntry {
  string id = 1;
  string name = 2;
  string path = 3;
  int64 size = 4;
}

message ManageDatasetRequest {
  string action = 1;
  string name = 2;
  string path = 3;
}

message ManageDatasetResponse {
  repeated DatasetEntry datasets = 1;
  string message = 2;
}
