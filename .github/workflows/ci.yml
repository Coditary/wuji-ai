name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/wuji-core
          path: wuji-core

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Point go.mod at checked-out wuji-core
        run: go mod edit -replace=github.com/coditary/wuji-core=./wuji-core

      - name: Check formatting
        run: make fmt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/wuji-core
          path: wuji-core

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Point go.mod at checked-out wuji-core
        run: go mod edit -replace=github.com/coditary/wuji-core=./wuji-core

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint
        run: golangci-lint run ./...

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/wuji-core
          path: wuji-core

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Point go.mod at checked-out wuji-core
        run: go mod edit -replace=github.com/coditary/wuji-core=./wuji-core

      - name: Verify module
        run: go mod verify

      - name: Build CLI
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  cover-check:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/wuji-core
          path: wuji-core

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Point go.mod at checked-out wuji-core
        run: go mod edit -replace=github.com/coditary/wuji-core=./wuji-core

      - name: Coverage gate (>= 80% on internal/clix)
        run: make cover-check
